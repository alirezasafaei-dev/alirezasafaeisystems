    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Shell syntax
        run: |
          bash -n scripts/offline-external-scan.sh
          bash -n scripts/test-offline-external-scan.sh
