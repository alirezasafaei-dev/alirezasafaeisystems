name: Apply Supervisor MCP State Fix

on:
  push:
    branches:
      - 'verify/apply-supervisor-mcp-state-fix-20260816'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supervisor-mcp-state-isolation-20260816
          fetch-depth: 0
      - name: Apply minimal state-path fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/control-plane/asdev-supervisor.sh')
          text = path.read_text()

          marker = '  local mcp_check="$REPO_DIR/scripts/control-plane/mcp-health-check-v2.sh"\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one MCP checker marker, found {text.count(marker)}')
          text = text.replace(
              marker,
              marker +
              '  local mcp_state_dir="$REPO_DIR/.state/asdev-mcp"\n' +
              '  local mcp_state="$mcp_state_dir/latest.json"\n',
              1,
          )

          invocation = '    if bash "$mcp_check" 2>/dev/null; then\n'
          if text.count(invocation) != 1:
              raise SystemExit(f'expected exactly one MCP invocation, found {text.count(invocation)}')
          text = text.replace(
              invocation,
              '    mkdir -p "$mcp_state_dir"\n'
              '    if ASDEV_STATE_DIR="$mcp_state_dir" bash "$mcp_check" 2>/dev/null; then\n',
              1,
          )

          duplicate_state = '      local mcp_state="$REPO_DIR/.state/asdev-mcp/latest.json"\n'
          if text.count(duplicate_state) != 2:
              raise SystemExit(f'expected exactly two duplicate MCP state declarations, found {text.count(duplicate_state)}')
          text = text.replace(duplicate_state, '')

          path.write_text(text)
          PY

          bash -n scripts/control-plane/asdev-supervisor.sh
          bash -n scripts/control-plane/test-supervisor-mcp-state-isolation.sh
          git diff --check
          git diff -- scripts/control-plane/asdev-supervisor.sh
      - name: Commit fix to target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ASDEV GitHub Verifier'
          git config user.email 'asdev@alirezasafaeisystems.ir'
          git add scripts/control-plane/asdev-supervisor.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: isolate supervisor MCP state namespace'
          git push origin HEAD:fix/supervisor-mcp-state-isolation-20260816
