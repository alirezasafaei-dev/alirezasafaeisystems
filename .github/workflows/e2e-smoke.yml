name: E2E Smoke

on:
  workflow_dispatch:
    inputs:
      evidence_manifest:
        description: Repository-relative path to a complete, durable public-experience evidence manifest.
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'ai/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mother-e2e-smoke-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium without host package mutation
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: pnpm exec playwright install chromium
      - name: Run immutable three-run public experience performance comparison
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          PUBLIC_EXPERIENCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUBLIC_EXPERIENCE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/ci/run-public-experience-comparison.mjs
          --base-sha "$PUBLIC_EXPERIENCE_BASE_SHA"
          --candidate-sha "$PUBLIC_EXPERIENCE_CANDIDATE_SHA"
          --output test-results/public-experience/performance-comparison.json
      - name: Skip performance comparison without immutable pull-request base
        if: ${{ github.event_name != 'pull_request' && !cancelled() }}
        run: echo "UNVERIFIED performance comparison skipped; event has no immutable pull-request base SHA."
      - name: Map performance chunk witnesses to build modules
        if: ${{ github.event_name == 'pull_request' && always() && hashFiles('test-results/public-experience/performance-comparison.json') != '' }}
        run: >-
          node scripts/ci/inspect-public-experience-build.mjs
          --build-dir .next
          --report test-results/public-experience/performance-comparison.json
          --output test-results/public-experience/build-attribution.json
      - name: Run smoke tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: pnpm run test:e2e:smoke
      - name: Run accessibility tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: pnpm exec playwright test e2e/a11y.spec.ts
      - name: Run V3.2 public experience acceptance
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          PUBLIC_EXPERIENCE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec playwright test e2e/public-experience.spec.mjs
      - name: Create incomplete V3.2 evidence manifest draft
        if: ${{ !cancelled() }}
        env:
          PUBLIC_EXPERIENCE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_EXPERIENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          node scripts/ci/create-public-experience-evidence-draft.mjs
          S2-01 S2-02 S2-05 S2-06 S3-01 S3-03 S3-04 S3-05 S3-06
          S4-01 S4-02 S4-03 S4-05 S4-06 S4-07 S4-10 S4-11 S4-12
      - name: Validate supplied complete V3.2 evidence manifest
        if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() }}
        env:
          EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/validate-public-experience-evidence-trusted.mjs --manifest "$EVIDENCE_MANIFEST" --root "$GITHUB_WORKSPACE"
      - name: Upload V3.2 public experience evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v32-public-experience-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/public-experience
          if-no-files-found: error
          retention-days: 14
      - name: Run V3.1 visual contract
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: pnpm exec playwright test e2e/public-v31-visual.spec.ts
      - name: Upload V3.1 visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v31-visual-evidence-${{ github.sha }}
          path: test-results/v31-evidence
          if-no-files-found: error
          retention-days: 14
