name: Clean Closed PR Verification Runs 146 147 149

on:
  push:
    branches:
      - verify/cleanup-closed-pr-runs-146-147-149

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only active verification runs owned by closed PRs
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GH_REPO}"

          allowed_workflow() {
            case "$1" in
              "CI"|"CI Router"|"E2E Smoke"|"Lighthouse Budget"|"Security Audit"|"CodeQL") return 0 ;;
              *) return 1 ;;
            esac
          }

          total_cancelled=0
          for pr_number in 146 147 149; do
            pr="$(gh api "${api}/pulls/${pr_number}")"
            state="$(jq -r '.state' <<<"$pr")"
            branch="$(jq -r '.head.ref' <<<"$pr")"
            head_sha="$(jq -r '.head.sha' <<<"$pr")"
            test "$state" = closed || { echo "::error::PR ${pr_number} is no longer closed"; exit 1; }
            test -n "$branch" && test -n "$head_sha"
            echo "closed_pr=${pr_number} branch=${branch} head=${head_sha}"

            runs="$(gh api --paginate "${api}/actions/runs?branch=${branch}&per_page=100")"
            mapfile -t rows < <(
              jq -r --arg sha "$head_sha" '
                .workflow_runs[]
                | select(.event == "pull_request")
                | select(.head_sha == $sha)
                | select(.status == "queued" or .status == "pending" or .status == "in_progress" or .status == "waiting" or .status == "requested")
                | [.id, .name] | @tsv
              ' <<<"$runs"
            )

            pr_cancelled=0
            for row in "${rows[@]}"; do
              run_id="${row%%$'\t'*}"
              name="${row#*$'\t'}"
              allowed_workflow "$name" || continue

              fresh="$(gh api "${api}/actions/runs/${run_id}")"
              fresh_status="$(jq -r '.status' <<<"$fresh")"
              fresh_event="$(jq -r '.event' <<<"$fresh")"
              fresh_branch="$(jq -r '.head_branch' <<<"$fresh")"
              fresh_sha="$(jq -r '.head_sha' <<<"$fresh")"
              current_state="$(gh api "${api}/pulls/${pr_number}" --jq '.state')"

              test "$current_state" = closed || { echo "::error::PR ${pr_number} reopened during cleanup"; exit 1; }
              test "$fresh_event" = pull_request || continue
              test "$fresh_branch" = "$branch" || continue
              test "$fresh_sha" = "$head_sha" || continue
              case "$fresh_status" in queued|pending|in_progress|waiting|requested) ;; *) continue ;; esac

              echo "cancel closed-pr run=${run_id} pr=${pr_number} workflow=${name} status=${fresh_status}"
              set +e
              output="$(gh api --method POST "${api}/actions/runs/${run_id}/cancel" 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -ne 0 ]; then
                terminal="$(gh api "${api}/actions/runs/${run_id}" --jq '.status')"
                if [ "$terminal" != completed ]; then
                  echo "$output"
                  exit "$rc"
                fi
              fi
              pr_cancelled=$((pr_cancelled+1))
              total_cancelled=$((total_cancelled+1))
            done
            echo "closed_pr=${pr_number} cancelled=${pr_cancelled}"
          done

          echo "closed_pr_total_cancelled=${total_cancelled}"

      - name: Re-prove all target PRs are closed
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GH_REPO}"
          for pr_number in 146 147 149; do
            test "$(gh api "${api}/pulls/${pr_number}" --jq '.state')" = closed
          done
          echo 'All target PRs remain closed; no open PR was targeted.'
