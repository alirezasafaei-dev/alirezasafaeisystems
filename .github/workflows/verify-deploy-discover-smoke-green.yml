name: Verify Discover Deploy Smoke GREEN

on:
  push:
    branches:
      - verify/deploy-discover-smoke-green-20260817

permissions:
  contents: read

jobs:
  targeted-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run Discover deploy smoke contract
        run: pnpm exec vitest run tests/ci/deploy-discover-smoke.test.ts --reporter=verbose
