name: Deploy VPS

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "ops/**"
      - "prisma/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.*"
      - "postcss.config.*"
      - "eslint.config.*"
      - "scripts/deploy/**"
      - "scripts/vps-preflight.sh"
      - "scripts/verify.sh"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: Git ref to deploy (branch/tag/sha)
        required: true
        default: main
      confirmation:
        description: Type DEPLOY to continue
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-vps-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirmation == 'DEPLOY' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Provision ripgrep scanner
        run: bash scripts/ci/bootstrap-ripgrep.sh
      - name: Verify
        run: pnpm run verify

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality-gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirmation == 'DEPLOY' }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_JUMP_HOST: ${{ secrets.VPS_JUMP_HOST }}
      VPS_JUMP_USER: ${{ secrets.VPS_JUMP_USER }}
      VPS_JUMP_PORT: ${{ secrets.VPS_JUMP_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_JUMP_SSH_KEY }}" > ~/.ssh/id_jump_ed25519
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_jump_ed25519
          ssh-keyscan -p "${VPS_JUMP_PORT:-22}" -H "$VPS_JUMP_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-jump
            HostName $VPS_JUMP_HOST
            User $VPS_JUMP_USER
            Port ${VPS_JUMP_PORT:-22}
            IdentityFile ~/.ssh/id_jump_ed25519
            IdentitiesOnly yes
          Host deploy-target
            HostName $VPS_HOST
            User $VPS_USER
            Port ${VPS_PORT:-22}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyJump deploy-jump
          EOF
          chmod 600 ~/.ssh/config
          ssh -F ~/.ssh/config -o StrictHostKeyChecking=accept-new deploy-target true

      - name: Upload release source
        run: |
          set -euo pipefail
          RELEASE_ID="$(date -u +%Y%m%dT%H%M%SZ)"
          REMOTE_TMP="/tmp/alirezasafaeisystems-${RELEASE_ID}"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"

          ssh -F ~/.ssh/config deploy-target "mkdir -p '$REMOTE_TMP'"

          rsync -az --delete \
            -e "ssh -F ~/.ssh/config" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'coverage' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            ./ "deploy-target:$REMOTE_TMP/"

      - name: Execute remote deploy
        run: |
          set -euo pipefail
          ssh -F ~/.ssh/config deploy-target \
            "cd '$REMOTE_TMP' && bash ops/deploy/deploy.sh --env '$TARGET_ENV' --source-dir '$REMOTE_TMP' --release-id '$RELEASE_ID' --keep-releases 3"

      - name: Post-deploy smoke check
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = "production" ]; then
            PORT="3002"
            BASE_URL="https://alirezasafaeisystems.ir"
          else
            PORT="3003"
            BASE_URL="https://staging.alirezasafaeisystems.ir"
          fi

          # Run smoke checks from inside the VPS to avoid public-route CI network variance.
          ssh -F ~/.ssh/config deploy-target "\
            set -euo pipefail; \
            GET_CODE=\$(curl --connect-timeout 10 --max-time 30 -fsS -o /tmp/portfolio-ready-get.json -w '%{http_code}' http://127.0.0.1:${PORT}/api/ready); \
            HEAD_CODE=\$(curl --connect-timeout 10 --max-time 30 -sSI -o /tmp/portfolio-ready-head.txt -w '%{http_code}' -X HEAD http://127.0.0.1:${PORT}/api/ready); \
            test \"\${GET_CODE}\" = \"200\"; \
            test \"\${HEAD_CODE}\" = \"\${GET_CODE}\"; \
            grep -q '\"status\":\"ready\"' /tmp/portfolio-ready-get.json; \
            curl --connect-timeout 10 --max-time 30 -fsS '${BASE_URL}/api/ready' >/dev/null; \
            curl --connect-timeout 10 --max-time 30 -fsS '${BASE_URL}/' | grep -Eq 'lang=\"fa\"|dir=\"rtl\"'; \
            curl --connect-timeout 10 --max-time 30 -fsS '${BASE_URL}/services' >/dev/null; \
            curl --connect-timeout 10 --max-time 30 -fsS '${BASE_URL}/discover' >/dev/null; \
            curl --connect-timeout 10 --max-time 30 -fsS '${BASE_URL}/profile' | grep -q 'alireza_safaei_network'; \
          "

      - name: Output deployment summary
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            BASE_URL="https://alirezasafaeisystems.ir"
          else
            BASE_URL="https://staging.alirezasafaeisystems.ir"
          fi
          echo "Deployed ref: $TARGET_REF"
          echo "Environment: $TARGET_ENV"
          echo "Release ID: $RELEASE_ID"
          echo "URL: $BASE_URL"
