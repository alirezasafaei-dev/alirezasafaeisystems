name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: Git ref to deploy (branch/tag/sha)
        required: true
        default: main
      staging_confirmation:
        description: Type APPROVE_PHASE_2_STAGING_DEPLOY for a staging mutation
        required: true
        default: ""
      production_confirmation:
        description: Type APPROVE_CRITICAL_SITE_PRODUCTION_DEPLOY for a production deploy mutation
        required: true
        default: ""
      migration_confirmation:
        description: Type APPROVE_CRITICAL_SITE_MIGRATION for a production database migration
        required: true
        default: ""

permissions:
  contents: read
  statuses: write

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      resolved_sha: ${{ steps.resolve_ref.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}

      - id: resolve_ref
        name: Resolve immutable deployment SHA
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish deployment pending status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_REF: ${{ steps.resolve_ref.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = "production" ]; then
            CONTEXT="production/deploy"
          else
            CONTEXT="staging/deploy"
          fi
          PAYLOAD="$(jq -n \
            --arg state "pending" \
            --arg context "$CONTEXT" \
            --arg description "Deployment queued; quality gate running" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_REF" \
            -d "$PAYLOAD" >/dev/null

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Provision ripgrep scanner
        run: bash scripts/ci/bootstrap-ripgrep.sh
      - name: Verify
        run: pnpm run verify

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality-gate
    if: ${{ (inputs.environment == 'staging' && inputs.staging_confirmation == 'APPROVE_PHASE_2_STAGING_DEPLOY') || (inputs.environment == 'production' && inputs.production_confirmation == 'APPROVE_CRITICAL_SITE_PRODUCTION_DEPLOY' && inputs.migration_confirmation == 'APPROVE_CRITICAL_SITE_MIGRATION') }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-vps-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ inputs.environment }}
      TARGET_REF: ${{ needs.quality-gate.outputs.resolved_sha }}
      DEPLOY_BASE_DIR: /var/www/my-portfolio
      DEPLOY_APP_SLUG: my-portfolio
      DEPLOY_PERSISTENT_DB_PATH: /var/www/my-portfolio/shared/data/production.db
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_JUMP_HOST: ${{ secrets.VPS_JUMP_HOST }}
      VPS_JUMP_USER: ${{ secrets.VPS_JUMP_USER }}
      VPS_JUMP_PORT: ${{ secrets.VPS_JUMP_PORT }}
      VPS_SSH_KEY_PASSPHRASE: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.quality-gate.outputs.resolved_sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare live verification browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            if [ -z "$VPS_SSH_KEY_PASSPHRASE" ]; then
              echo "VPS_SSH_KEY_PASSPHRASE is required for the configured deploy key." >&2
              exit 1
            fi
            printf '%s\n' '#!/bin/sh' 'printf "%s\\n" "$VPS_SSH_KEY_PASSPHRASE"' > /tmp/asdev-ssh-askpass
            chmod 700 /tmp/asdev-ssh-askpass
            eval "$(ssh-agent -s)"
            SSH_ASKPASS=/tmp/asdev-ssh-askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add ~/.ssh/id_ed25519
            rm -f /tmp/asdev-ssh-askpass
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $VPS_HOST
            User $VPS_USER
            Port ${VPS_PORT:-22}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF
          if [ -n "$VPS_JUMP_HOST" ]; then
            printf '%s\n' "${{ secrets.VPS_JUMP_SSH_KEY }}" > ~/.ssh/id_jump_ed25519
            chmod 600 ~/.ssh/id_jump_ed25519
            ssh-keyscan -p "${VPS_JUMP_PORT:-22}" -H "$VPS_JUMP_HOST" >> ~/.ssh/known_hosts
            cat >> ~/.ssh/config <<EOF
            Host deploy-jump
              HostName $VPS_JUMP_HOST
              User $VPS_JUMP_USER
              Port ${VPS_JUMP_PORT:-22}
              IdentityFile ~/.ssh/id_jump_ed25519
              IdentitiesOnly yes
            Host deploy-target
              ProxyJump deploy-jump
          EOF
          fi
          chmod 600 ~/.ssh/config
          ssh -F ~/.ssh/config -o StrictHostKeyChecking=accept-new deploy-target true

      - name: Upload release source
        run: |
          set -euo pipefail
          RELEASE_ID="$(date -u +%Y%m%dT%H%M%SZ)"
          REMOTE_TMP="/tmp/alirezasafaeisystems-${RELEASE_ID}"
          SOURCE_ARCHIVE="/tmp/alirezasafaeisystems-${TARGET_REF}.tar.gz"
          REMOTE_ARCHIVE="/tmp/alirezasafaeisystems-source-${TARGET_REF}.tar.gz"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"
          echo "SOURCE_ARCHIVE=$SOURCE_ARCHIVE" >> "$GITHUB_ENV"
          echo "REMOTE_ARCHIVE=$REMOTE_ARCHIVE" >> "$GITHUB_ENV"

          git archive --format=tar.gz HEAD > "$SOURCE_ARCHIVE"
          test -s "$SOURCE_ARCHIVE"
          SOURCE_SHA256="$(sha256sum "$SOURCE_ARCHIVE" | awk '{print $1}')"
          echo "SOURCE_SHA256=$SOURCE_SHA256" >> "$GITHUB_ENV"

          ssh -F ~/.ssh/config -o ServerAliveInterval=30 -o ServerAliveCountMax=6 deploy-target "mkdir -p '$REMOTE_TMP'"
          rsync -a --partial --inplace --timeout=60 --info=progress2 \
            -e "ssh -F $HOME/.ssh/config -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6" \
            "$SOURCE_ARCHIVE" "deploy-target:$REMOTE_ARCHIVE"
          REMOTE_SHA256="$(ssh -F ~/.ssh/config -o ServerAliveInterval=30 -o ServerAliveCountMax=6 deploy-target "sha256sum '$REMOTE_ARCHIVE'" | awk '{print $1}')"
          test "$REMOTE_SHA256" = "$SOURCE_SHA256"
          ssh -F ~/.ssh/config -o ServerAliveInterval=30 -o ServerAliveCountMax=6 deploy-target "tar -xzf '$REMOTE_ARCHIVE' -C '$REMOTE_TMP' && rm -f '$REMOTE_ARCHIVE'"

      - name: Relocate legacy production SQLite to persistent storage
        if: ${{ env.TARGET_ENV == 'production' && inputs.migration_confirmation == 'APPROVE_CRITICAL_SITE_MIGRATION' }}
        run: |
          set -euo pipefail
          ssh -F ~/.ssh/config deploy-target \
            "cd '$REMOTE_TMP' && BASE_DIR='$DEPLOY_BASE_DIR' APP_SLUG='$DEPLOY_APP_SLUG' PERSISTENT_DB_PATH='$DEPLOY_PERSISTENT_DB_PATH' bash ops/deploy/migrate-legacy-sqlite.sh --env '$TARGET_ENV'"

      - name: Execute remote deploy
        id: remote_deploy
        run: |
          set -euo pipefail
          ssh -F ~/.ssh/config deploy-target \
            "cd '$REMOTE_TMP' && BASE_DIR='$DEPLOY_BASE_DIR' APP_SLUG='$DEPLOY_APP_SLUG' bash ops/deploy/deploy.sh --env '$TARGET_ENV' --source-dir '$REMOTE_TMP' --release-id '$RELEASE_ID' --keep-releases 3"

      - name: Post-deploy smoke check
        id: post_deploy_smoke
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = "production" ]; then
            PORT="3002"
            BASE_HOST="alirezasafaeisystems.ir"
          else
            PORT="3003"
            BASE_HOST="staging.alirezasafaeisystems.ir"
          fi
          BASE_URL="https://${BASE_HOST}"
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"

          # Run same-host smoke through the canonical HTTPS vhost/SNI while bypassing only the VPS resolver.
          # The later live browser verifier intentionally keeps real public DNS/routing coverage.
          ssh -F ~/.ssh/config deploy-target "\
            set -euo pipefail; \
            GET_CODE=\$(curl --connect-timeout 10 --max-time 30 -fsS -o /tmp/portfolio-ready-get.json -w '%{http_code}' http://127.0.0.1:${PORT}/api/ready); \
            HEAD_CODE=\$(curl --connect-timeout 10 --max-time 30 -sSI -o /tmp/portfolio-ready-head.txt -w '%{http_code}' -X HEAD http://127.0.0.1:${PORT}/api/ready); \
            test \"\${GET_CODE}\" = \"200\"; \
            test \"\${HEAD_CODE}\" = \"\${GET_CODE}\"; \
            grep -q '\"status\":\"ready\"' /tmp/portfolio-ready-get.json; \
            curl --connect-timeout 10 --max-time 30 -fsS --resolve '${BASE_HOST}:443:127.0.0.1' '${BASE_URL}/api/ready' >/dev/null; \
            curl --connect-timeout 10 --max-time 30 -fsS --resolve '${BASE_HOST}:443:127.0.0.1' -o /tmp/portfolio-home.html '${BASE_URL}/'; \
            grep -Eq 'lang=\"fa\"|dir=\"rtl\"' /tmp/portfolio-home.html; \
            curl --connect-timeout 10 --max-time 30 -fsS --resolve '${BASE_HOST}:443:127.0.0.1' '${BASE_URL}/services' >/dev/null; \
            curl --connect-timeout 10 --max-time 30 -fsS --resolve '${BASE_HOST}:443:127.0.0.1' '${BASE_URL}/discover' >/dev/null; \
            curl --connect-timeout 10 --max-time 30 -fsS --resolve '${BASE_HOST}:443:127.0.0.1' -o /tmp/portfolio-discover-en.html '${BASE_URL}/en/discover'; \
            grep -q 'lang=\"en\"' /tmp/portfolio-discover-en.html; \
            grep -q 'dir=\"ltr\"' /tmp/portfolio-discover-en.html; \
            curl --connect-timeout 10 --max-time 30 -fsS --resolve '${BASE_HOST}:443:127.0.0.1' -o /tmp/portfolio-profile.html '${BASE_URL}/profile'; \
            grep -q 'alireza_safaei_network' /tmp/portfolio-profile.html; \
          "

      - name: Live browser production verification
        id: live_verify
        continue-on-error: true
        run: |
          set -euo pipefail
          for PASS in 1 2; do
            LIVE_VERIFY_BASE_URL="$BASE_URL" \
            LIVE_VERIFY_RELEASE_SHA="$TARGET_REF" \
            LIVE_VERIFY_REPORT_PATH="$GITHUB_WORKSPACE/live-verification-report-pass-${PASS}.md" \
            node scripts/deploy/live-verify.mjs
          done

      - name: Preserve live verification report path
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/docs/reports/live-verification"
          for REPORT in "$GITHUB_WORKSPACE"/live-verification-report-pass-*.md; do
            [ -f "$REPORT" ] || continue
            BASENAME="$(basename "$REPORT")"
            cp "$REPORT" \
              "$GITHUB_WORKSPACE/docs/reports/live-verification/${RELEASE_ID}-${TARGET_ENV}-${BASENAME}"
          done

      - name: Upload live verification evidence
        if: ${{ always() && steps.live_verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-verification-${{ github.run_id }}
          if-no-files-found: error
          path: |
            live-verification-report-pass-*.md
            docs/reports/live-verification/*.md
            live-verification-artifacts/**

      - name: Publish live verification commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_VERIFY_OUTCOME: ${{ steps.live_verify.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$LIVE_VERIFY_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="Two consecutive live browser verification passes succeeded"
          elif [ "$LIVE_VERIFY_OUTCOME" = "skipped" ]; then
            STATE="failure"
            DESCRIPTION="Live browser verification was not executed because deployment failed or was blocked"
          else
            STATE="failure"
            DESCRIPTION="Live browser verification failed"
          fi
          if [ "$TARGET_ENV" = "production" ]; then
            CONTEXT="production/live-verification"
          else
            CONTEXT="staging/live-verification"
          fi
          PAYLOAD="$(jq -n \
            --arg state "$STATE" \
            --arg context "$CONTEXT" \
            --arg description "$DESCRIPTION" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_REF" \
            -d "$PAYLOAD" >/dev/null

      - name: Enforce live verification gate
        if: ${{ steps.live_verify.outcome == 'failure' }}
        run: exit 1

      - name: Roll back failed production verification
        if: ${{ always() && steps.remote_deploy.outcome == 'success' && (steps.post_deploy_smoke.outcome == 'failure' || steps.live_verify.outcome == 'failure') }}
        run: |
          set -euo pipefail
          ssh -F ~/.ssh/config deploy-target \
            "cd '$REMOTE_TMP' && BASE_DIR='$DEPLOY_BASE_DIR' APP_SLUG='$DEPLOY_APP_SLUG' bash ops/deploy/rollback-release.sh --env '$TARGET_ENV' --release-id '$RELEASE_ID'"

      - name: Output deployment summary
        if: ${{ steps.post_deploy_smoke.outcome == 'success' && steps.live_verify.outcome == 'success' }}
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            BASE_URL="https://alirezasafaeisystems.ir"
          else
            BASE_URL="https://staging.alirezasafaeisystems.ir"
          fi
          echo "Deployed ref: $TARGET_REF"
          echo "Environment: $TARGET_ENV"
          echo "Release ID: $RELEASE_ID"
          echo "URL: $BASE_URL"

  deployment-status:
    name: Publish deployment verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality-gate, deploy]
    if: ${{ always() }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ENV: ${{ inputs.environment }}
      TARGET_REF: ${{ needs.quality-gate.outputs.resolved_sha }}
      QUALITY_RESULT: ${{ needs.quality-gate.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish final deployment status
        run: |
          set -euo pipefail
          if [ "$QUALITY_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            STATE="success"
            DESCRIPTION="Deployment and live verification passed"
          else
            STATE="failure"
            DESCRIPTION="Deployment blocked or failed; inspect workflow run"
          fi
          if [ "$TARGET_ENV" = "production" ]; then
            CONTEXT="production/deploy"
          else
            CONTEXT="staging/deploy"
          fi
          PAYLOAD="$(jq -n \
            --arg state "$STATE" \
            --arg context "$CONTEXT" \
            --arg description "$DESCRIPTION" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_REF" \
            -d "$PAYLOAD" >/dev/null