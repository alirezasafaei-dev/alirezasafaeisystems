name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: mother-codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52

      - name: Perform CodeQL Analysis
        id: codeql-analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52

      - name: CodeQL upload warning
        if: ${{ steps.codeql-analyze.outcome == 'failure' }}
        run: |
          echo "CodeQL analysis upload failed (likely code scanning is not enabled for this repository)."
          echo "Enable GitHub Advanced Security / code scanning in repository settings to enforce this gate."
