name: Discover Browser Verify

on:
  push:
    branches:
      - verify/discover-browser-7866e2af

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Discover head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure absolute SQLite database
        run: echo "DATABASE_URL=file:${GITHUB_WORKSPACE}/prisma/dev.db" >> "$GITHUB_ENV"

      - name: Setup database
        run: pnpm run db:push

      - name: Production build
        run: pnpm run build

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: pnpm exec playwright install chromium

      - name: Browser smoke
        env:
          CI: "true"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          PLAYWRIGHT_DISABLE_WEBSERVER: "true"
        run: |
          set -euo pipefail
          PORT=3100 pnpm run start > /tmp/discover-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/api/ready >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/discover-browser-server.log
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/discover-browser-server.log
              exit 1
            fi
            sleep 2
          done
          pnpm exec playwright test e2e/smoke.spec.mjs --config=playwright.config.mjs --reporter=list --workers=1 --retries=1
