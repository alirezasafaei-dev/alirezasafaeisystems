name: Verify Discover Security RED

on:
  push:
    branches:
      - verify/discover-security-red-20260817

permissions:
  contents: read

jobs:
  targeted-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run targeted analytics regression
        run: pnpm exec vitest run src/__tests__/lib/analytics-client.test.ts --reporter=verbose
