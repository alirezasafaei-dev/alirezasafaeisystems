name: Verify Supervisor MCP State

on:
  push:
    branches:
      - 'verify/supervisor-mcp-state-*'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n scripts/control-plane/asdev-supervisor.sh
          bash -n scripts/control-plane/test-supervisor-mcp-state-isolation.sh
      - name: Reproduce MCP state namespace bug
        run: bash scripts/control-plane/test-supervisor-mcp-state-isolation.sh
