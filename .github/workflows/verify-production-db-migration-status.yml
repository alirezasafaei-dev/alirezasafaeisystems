name: Verify Production DB Migration Status

on:
  push:
    branches:
      - verify/production-db-migration-status-20260817

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_JUMP_HOST: ${{ secrets.VPS_JUMP_HOST }}
      VPS_JUMP_USER: ${{ secrets.VPS_JUMP_USER }}
      VPS_JUMP_PORT: ${{ secrets.VPS_JUMP_PORT }}
    steps:
      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_JUMP_SSH_KEY }}" > ~/.ssh/id_jump_ed25519
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/id_jump_ed25519
          ssh-keyscan -p "${VPS_JUMP_PORT:-22}" -H "$VPS_JUMP_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-jump
            HostName $VPS_JUMP_HOST
            User $VPS_JUMP_USER
            Port ${VPS_JUMP_PORT:-22}
            IdentityFile ~/.ssh/id_jump_ed25519
            IdentitiesOnly yes
          Host deploy-target
            HostName $VPS_HOST
            User $VPS_USER
            Port ${VPS_PORT:-22}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyJump deploy-jump
          EOF
          chmod 600 ~/.ssh/config
          ssh -F ~/.ssh/config -o StrictHostKeyChecking=accept-new deploy-target true

      - name: Read-only Prisma migration status
        run: |
          set -euo pipefail
          ssh -F ~/.ssh/config deploy-target 'set -euo pipefail
            CURRENT=/var/www/my-portfolio/current/production
            cd "$CURRENT"
            set -a
            source /var/www/my-portfolio/shared/env/production.env
            set +a

            case "${DATABASE_URL:-}" in
              file:/*)
                echo "[diagnostic] database URL class: absolute SQLite"
                DB_SPEC="${DATABASE_URL#file:}"
                DB_SPEC="${DB_SPEC%%\?*}"
                ;;
              file:*)
                echo "[diagnostic] database URL class: relative SQLite"
                DB_SPEC="${DATABASE_URL#file:}"
                DB_SPEC="${DB_SPEC%%\?*}"
                ;;
              *)
                echo "[diagnostic] database URL class: unsupported by current SQLite schema" >&2
                exit 2
                ;;
            esac

            if [[ "$DB_SPEC" = /* ]]; then
              candidate_absolute="$DB_SPEC"
            else
              candidate_absolute=""
            fi
            candidate_cwd="$(realpath -m "$CURRENT/$DB_SPEC")"
            candidate_schema="$(realpath -m "$CURRENT/prisma/$DB_SPEC")"
            candidate_generated="$(realpath -m "$CURRENT/node_modules/.prisma/client/$DB_SPEC")"

            absolute_exists=false
            cwd_exists=false
            schema_exists=false
            generated_exists=false
            [[ -n "$candidate_absolute" && -f "$candidate_absolute" ]] && absolute_exists=true
            [[ -f "$candidate_cwd" ]] && cwd_exists=true
            [[ -f "$candidate_schema" ]] && schema_exists=true
            [[ -f "$candidate_generated" ]] && generated_exists=true

            echo "[diagnostic] candidate exists: absolute=${absolute_exists} cwd=${cwd_exists} schema=${schema_exists} generated=${generated_exists}"

            node -e "const {PrismaClient}=require('@prisma/client'); const p=new PrismaClient(); (async()=>{const rows=await p.\$queryRawUnsafe(\"SELECT name FROM sqlite_master WHERE type = 'table'\"); const names=new Set(rows.map(r=>String(r.name))); console.log('[diagnostic] Prisma Client connection: success; tables='+names.size); console.log('[diagnostic] migration table present: '+names.has('_prisma_migrations')); if(names.has('_prisma_migrations')){const m=await p.\$queryRawUnsafe(\"SELECT migration_name, finished_at, rolled_back_at FROM _prisma_migrations ORDER BY started_at\"); console.log('[diagnostic] migration rows='+m.length+'; unfinished='+m.filter(r=>!r.finished_at&&!r.rolled_back_at).length)}})().finally(()=>p.\$disconnect())"

            pnpm exec prisma migrate status
          '
