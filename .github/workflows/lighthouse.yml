name: Lighthouse Budget

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mother-lighthouse-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:${{ github.workspace }}/test-results/playwright.db"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Prepare disposable Lighthouse data
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          pnpm prisma db push --skip-generate --accept-data-loss
          node scripts/test/seed-playwright-discover.mjs
      - name: Install Chromium for Lighthouse
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: pnpm exec playwright install chromium
      - name: Run Lighthouse CI
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          export CHROME_PATH="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome -perm -111 -print -quit)"
          test -x "$CHROME_PATH"
          pnpm run lighthouse:ci
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lighthouse-budget-${{ github.sha }}
          path: artifacts/lighthouse
          if-no-files-found: error
          retention-days: 7
