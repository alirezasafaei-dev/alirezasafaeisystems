name: Security Audit

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'ai/**'
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: mother-security-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run dependency review
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
      - name: Dependency review unsupported fallback
        if: steps.dependency_review.outcome == 'failure'
        run: |
          echo "Dependency review is unsupported for this repository configuration. Skipping as non-blocking."

  pnpm-audit:
    name: pnpm audit (high/critical gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit high/critical gate
        run: pnpm run audit:high

  secret-scan:
    name: Secret scan (repo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify scanner availability without mutating runner
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            rg --version | head -n 1
          elif git grep -P -n 'asdev-secret-scan-probe-never-match' -- . >/dev/null 2>&1; then
            echo "git grep PCRE fallback is available"
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "git grep PCRE fallback is available"
            else
              echo "::error::Neither ripgrep nor a working git-grep PCRE fallback is available."
              exit 2
            fi
          fi
      - name: Verify secret scan fallback contract
        run: bash scripts/test-scan-secrets.sh
      - name: Run local secret scan gate
        run: bash scripts/scan-secrets.sh
