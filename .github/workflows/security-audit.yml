name: Security Audit

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'ai/**'
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: mother-security-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, asdev-ci]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency review
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
      - name: Dependency review unsupported fallback
        if: steps.dependency_review.outcome == 'failure'
        run: |
          echo "Dependency review is unsupported for this repository configuration. Skipping as non-blocking."

  pnpm-audit:
    name: pnpm audit (high/critical gate)
    runs-on: [self-hosted, linux, x64, asdev-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit high/critical gate
        run: pnpm run audit:high

  secret-scan:
    name: Secret scan (repo)
    runs-on: [self-hosted, linux, x64, asdev-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ripgrep is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            rg --version | head -n 1
            exit 0
          fi

          if command -v apt-get >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              DEBIAN_FRONTEND=noninteractive apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y ripgrep
            elif command -v sudo >/dev/null 2>&1; then
              sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update
              sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y ripgrep
            fi
          fi

          if ! command -v rg >/dev/null 2>&1; then
            echo "::error::ripgrep (rg) is required for the repository secret-scan gate."
            exit 2
          fi
          rg --version | head -n 1
      - name: Verify secret scan fails closed without scanner
        run: bash scripts/test-scan-secrets.sh
      - name: Run local secret scan gate
        run: bash scripts/scan-secrets.sh
