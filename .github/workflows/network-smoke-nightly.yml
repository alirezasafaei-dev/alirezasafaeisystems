name: Network Smoke Nightly

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Chromium network smoke
        run: pnpm run network:smoke:chrome
      - name: Publish Network Smoke summary
        if: always()
        shell: bash
        run: |
          report=$(find reports/network-smoke -name report.md -type f -print 2>/dev/null | sort | tail -n 1)
          if [[ -n "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Network Smoke report unavailable; ASDEV measurement is unproven." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Run enterprise network audit
        run: pnpm run enterprise:audit:network
      - name: Upload network artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-smoke-and-audit-reports
          path: |
            reports/network-smoke/
            reports/enterprise-network/
          if-no-files-found: warn
